<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf solitaire — Parlour table</title>
    <style>
      :root {
        --felt-deep: #1d4c52;
        --felt-mid: #246066;
        --felt-lit: #2f7d7a;
        --ink: #14343a;
        --paper: #f4efe4;
        --paper-edge: #e4d8c4;
        --gold: #e2b049;
        --rust: #b8593f;
        --play: #7ee0b0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #10282c;
        color: var(--paper);
        font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif;
      }

      .shell {
        min-height: 100%;
        padding: 14px 16px 16px;
        background:
          radial-gradient(120% 80% at 50% 18%, rgba(47, 125, 122, 0.45), transparent 55%),
          linear-gradient(180deg, var(--felt-lit), var(--felt-deep) 62%, #16363b);
      }

      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px;
        border-radius: 999px;
        background: rgba(16, 40, 44, 0.42);
        border: 1px solid rgba(244, 239, 228, 0.12);
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .pill strong {
        color: var(--gold);
        font-weight: 600;
      }

      .felt {
        position: relative;
        border-radius: 22px;
        padding: 18px 18px 16px;
        background:
          radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255, 255, 255, 0.08), transparent 50%),
          repeating-linear-gradient(125deg, rgba(255, 255, 255, 0.015) 0 2px, transparent 2px 6px),
          linear-gradient(180deg, #2b7674, #1d5256 70%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          inset 0 -40px 60px rgba(10, 28, 32, 0.28),
          0 18px 40px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }

      .monogram {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -54%);
        font-size: 92px;
        font-weight: 700;
        color: rgba(16, 40, 44, 0.16);
        letter-spacing: -0.04em;
        pointer-events: none;
        user-select: none;
      }

      .tableau {
        position: relative;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
        max-width: 560px;
        margin: 0 auto 8px;
        z-index: 1;
      }

      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 196px;
      }

      .col .card + .card {
        margin-top: -44px;
      }

      .well {
        display: flex;
        justify-content: center;
        gap: 28px;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid rgba(244, 239, 228, 0.08);
        position: relative;
        z-index: 1;
      }

      .zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 72px;
      }

      .zone label {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(244, 239, 228, 0.7);
      }

      .zone .hint {
        font-size: 11px;
        color: rgba(244, 239, 228, 0.55);
        font-style: italic;
      }

      .card {
        width: 58px;
        height: 80px;
        border-radius: 7px;
        position: relative;
        transform-origin: center top;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          filter 160ms ease;
        user-select: none;
      }

      .card.face {
        background: linear-gradient(180deg, #fffaf0, var(--paper));
        border: 1px solid var(--paper-edge);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.8) inset,
          0 6px 10px rgba(0, 0, 0, 0.22);
        color: var(--ink);
      }

      .card.back {
        background: repeating-linear-gradient(45deg, #245c62 0 4px, #1b484e 4px 8px);
        border: 1px solid #14383c;
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.28);
      }

      .card.back::after {
        content: 'P';
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(226, 176, 73, 0.45);
        border-radius: 4px;
        display: grid;
        place-items: center;
        color: var(--gold);
        font-size: 18px;
        font-weight: 700;
      }

      .card .tl,
      .card .br {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        font-weight: 700;
      }

      .card .tl {
        top: 5px;
        left: 6px;
        font-size: 12px;
      }

      .card .br {
        right: 6px;
        bottom: 5px;
        font-size: 12px;
        transform: rotate(180deg);
      }

      .card .pip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 22px;
      }

      .red {
        color: var(--rust);
      }

      .black {
        color: #1b3034;
      }

      .card.playable {
        outline: 2px solid var(--play);
        outline-offset: 2px;
        box-shadow:
          0 0 0 4px rgba(126, 224, 176, 0.18),
          0 10px 16px rgba(0, 0, 0, 0.28);
        cursor: pointer;
        z-index: 3;
        animation: pulse 1.6s ease-in-out infinite;
      }

      .card.playable:hover {
        transform: translateY(-8px);
      }

      .card.stock-draw {
        cursor: pointer;
      }

      .card.stock-draw:hover {
        transform: translateY(-4px);
      }

      .card.gone {
        visibility: hidden;
        pointer-events: none;
      }

      .stack {
        position: relative;
        width: 58px;
        height: 80px;
      }

      .stack .card {
        position: absolute;
        inset: 0;
      }

      .stack .card:nth-child(1) {
        transform: translate(-4px, 3px) rotate(-6deg);
      }

      .stack .card:nth-child(2) {
        transform: translate(3px, -2px) rotate(5deg);
      }

      .stack .card:nth-child(3) {
        transform: none;
      }

      .flight {
        position: absolute;
        z-index: 8;
        pointer-events: none;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 18px;
        margin-top: 12px;
        font-size: 12px;
        color: rgba(244, 239, 228, 0.78);
      }

      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 99px;
        margin-right: 6px;
        vertical-align: -1px;
      }

      .swatch.play {
        background: var(--play);
        box-shadow: 0 0 0 3px rgba(126, 224, 176, 0.2);
      }

      .swatch.hole {
        background: var(--gold);
      }

      .status {
        min-height: 1.3em;
        margin-top: 8px;
        font-size: 13px;
        color: rgba(244, 239, 228, 0.88);
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow:
            0 0 0 4px rgba(126, 224, 176, 0.16),
            0 10px 16px rgba(0, 0, 0, 0.28);
        }
        50% {
          box-shadow:
            0 0 0 6px rgba(126, 224, 176, 0.28),
            0 12px 18px rgba(0, 0, 0, 0.3);
        }
      }

      @media (max-width: 520px) {
        .card,
        .stack {
          width: 44px;
          height: 62px;
        }

        .col .card + .card {
          margin-top: -36px;
        }

        .card .tl,
        .card .br {
          font-size: 10px;
        }

        .card .pip {
          font-size: 16px;
        }

        .monogram {
          font-size: 72px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hud">
        <div class="pill">Golf <strong>hole 1</strong></div>
        <div class="pill">cleared <strong id="cleared">0</strong> / 35</div>
        <div class="pill">to par <strong id="left">35</strong></div>
      </div>

      <div class="felt" id="felt">
        <div class="monogram">G</div>
        <div class="tableau" id="tableau"></div>

        <div class="well">
          <div class="zone">
            <label>Stock</label>
            <div class="stack" id="stock" title="Draw the next hole card"></div>
            <div class="hint" id="stockHint">17 left · tap to turn</div>
          </div>
          <div class="zone">
            <label>The hole</label>
            <div id="waste"></div>
            <div class="hint">play rank ±1, any suit</div>
          </div>
        </div>
      </div>

      <p class="status" id="status">
        Waste is 8♥. Tap a glowing card — 7 or 9, any suit — onto the hole.
      </p>
      <div class="legend">
        <span><i class="swatch play"></i>legal from a column foot</span>
        <span><i class="swatch hole"></i>only the hole accepts cards</span>
        <span>no color, no foundations, no hidden cards</span>
      </div>
    </div>

    <script>
      const RANK = { A: 1, J: 11, Q: 12, K: 13 };
      const SUIT_COLOR = { '♠': 'black', '♣': 'black', '♥': 'red', '♦': 'red' };

      const columns = [
        ['A♠', '5♦', 'J♣', '10♥', '9♠'],
        ['K♥', '2♣', '7♦', 'Q♠', '4♥'],
        ['10♣', '6♠', 'A♦', '8♦', '7♣'],
        ['5♠', 'K♣', '9♥', '2♦', 'Q♥'],
        ['3♣', 'J♦', '4♠', '10♦', '6♥'],
        ['8♣', 'A♥', '5♣', 'K♦', '2♠'],
        ['9♦', '3♦', 'J♥', '4♦', 'Q♣'],
      ];

      const stock = [
        '3♠',
        '6♣',
        'K♠',
        'A♣',
        '5♥',
        'J♠',
        '2♥',
        '7♥',
        'Q♦',
        '4♣',
        '8♠',
        '10♠',
        '6♦',
        '9♣',
        '7♠',
        '3♥',
        '6♠',
      ];
      let waste = '8♥';
      let flying = false;

      function parse(face) {
        const suit = face.slice(-1);
        const rank = face.slice(0, -1);
        return { face, suit, rank, n: RANK[rank] || Number(rank), color: SUIT_COLOR[suit] };
      }

      function legal(face) {
        const a = parse(face).n;
        const b = parse(waste).n;
        return Math.abs(a - b) === 1;
      }

      function cardEl(face, extra = '') {
        const { rank, suit, color } = parse(face);
        const el = document.createElement('button');
        el.type = 'button';
        el.className = `card face ${color} ${extra}`.trim();
        el.dataset.face = face;
        el.innerHTML = `<span class="tl">${rank}<span>${suit}</span></span><span class="pip">${suit}</span><span class="br">${rank}<span>${suit}</span></span>`;
        return el;
      }

      function backEl(extra = '') {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = `card back ${extra}`.trim();
        return el;
      }

      function render() {
        const tableau = document.getElementById('tableau');
        tableau.replaceChildren();
        columns.forEach((col, i) => {
          const wrap = document.createElement('div');
          wrap.className = 'col';
          col.forEach((face, j) => {
            const exposed = j === col.length - 1;
            const el = cardEl(face, exposed && legal(face) ? 'playable' : '');
            if (exposed && legal(face)) {
              el.addEventListener('click', () => playFrom(i));
              el.title = `Play ${face} onto ${waste}`;
            } else {
              el.disabled = true;
            }
            wrap.appendChild(el);
          });
          tableau.appendChild(wrap);
        });

        const stockBox = document.getElementById('stock');
        stockBox.replaceChildren();
        const shown = Math.min(3, stock.length);
        for (let i = 0; i < shown; i++) {
          const back = backEl(i === shown - 1 ? 'stock-draw' : '');
          if (i === shown - 1) back.addEventListener('click', drawStock);
          stockBox.appendChild(back);
        }
        if (stock.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'card';
          empty.style.background = 'transparent';
          empty.style.border = '1px dashed rgba(244,239,228,0.25)';
          empty.style.boxShadow = 'none';
          stockBox.appendChild(empty);
        }

        const wasteBox = document.getElementById('waste');
        wasteBox.replaceChildren(cardEl(waste));

        const remaining = columns.reduce((n, col) => n + col.length, 0);
        document.getElementById('cleared').textContent = String(35 - remaining);
        document.getElementById('left').textContent = String(remaining);
        document.getElementById('stockHint').textContent =
          stock.length === 0 ? 'empty' : `${stock.length} left · tap to turn`;
      }

      function setStatus(text) {
        document.getElementById('status').textContent = text;
      }

      function playableList() {
        return columns.map((col) => col[col.length - 1]).filter((face) => face && legal(face));
      }

      function afterChange(note) {
        render();
        const plays = playableList();
        if (plays.length) {
          setStatus(`${note} Hole is ${waste}. Play ${plays.join(' or ')}.`);
        } else if (stock.length) {
          setStatus(`${note} No ±1 showing. Turn the stock.`);
        } else {
          const left = columns.reduce((n, col) => n + col.length, 0);
          setStatus(
            left
              ? `${note} Stock is gone. ${left} left on the grass — that is your score.`
              : `${note} Table cleared. Hole in one.`,
          );
        }
      }

      function playFrom(colIndex) {
        if (flying) return;
        const face = columns[colIndex][columns[colIndex].length - 1];
        if (!face || !legal(face)) return;
        fly(face, () => {
          columns[colIndex].pop();
          waste = face;
          afterChange(`Played ${face}.`);
        });
      }

      function drawStock() {
        if (flying || stock.length === 0) return;
        const face = stock.pop();
        fly(
          face,
          () => {
            waste = face;
            afterChange(`Turned ${face}.`);
          },
          true,
        );
      }

      function fly(face, done, fromStock) {
        flying = true;
        const origin = fromStock
          ? document.querySelector('#stock .card:last-child')
          : document.querySelector(`.card.playable[data-face="${CSS.escape(face)}"]`);
        const dest = document.querySelector('#waste .card') || document.getElementById('waste');
        if (!origin || !dest) {
          flying = false;
          done();
          return;
        }
        const a = origin.getBoundingClientRect();
        const b = dest.getBoundingClientRect();
        const ghost = cardEl(face, 'flight');
        ghost.style.left = `${a.left}px`;
        ghost.style.top = `${a.top}px`;
        document.body.appendChild(ghost);
        origin.classList.add('gone');
        requestAnimationFrame(() => {
          ghost.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px)`;
        });
        window.setTimeout(() => {
          ghost.remove();
          flying = false;
          done();
        }, 230);
      }

      render();
    </script>
  </body>
</html>
