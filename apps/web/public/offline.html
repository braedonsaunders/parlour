<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#152833" />
    <title>parlour · offline</title>
    <style>
      :root {
        --app-height: 100dvh;
      }
      @media (display-mode: standalone), (display-mode: fullscreen) {
        :root {
          --app-height: 100lvh;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: var(--app-height);
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #fdf6ec;
        font:
          600 16px/1.5 ui-rounded,
          system-ui,
          sans-serif;
        text-align: center;
        background:
          radial-gradient(circle at 50% 95%, #b8724a 0, transparent 42%),
          linear-gradient(#14222f, #244a5c 70%, #152833);
      }
      main {
        max-width: 430px;
        padding: 34px;
        border: 1px solid #afdae433;
        border-radius: 28px;
        background: #152833cc;
        box-shadow: 0 24px 70px #061016aa;
      }
      img {
        width: 92px;
        height: 92px;
        border-radius: 20px;
        box-shadow: 0 18px 35px #06101688;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 30px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: #d7edf2;
      }
      button {
        margin-top: 22px;
        padding: 12px 24px;
        border: 2px solid #78391d;
        border-radius: 999px;
        background: linear-gradient(#f6bd7a, #d97a2b);
        color: #43200a;
        font: inherit;
        font-weight: 800;
        box-shadow: inset 0 -4px #78391d88;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #ffd9a0;
        outline-offset: 4px;
      }
      .aside {
        margin-top: 12px;
        font-size: 13px;
        color: #afdae4;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You’re still at the table.</h1>
      <p>The network stepped away. Your installed solo games are still ready to play.</p>
      <p class="aside">Friend rooms will be waiting when you reconnect.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
