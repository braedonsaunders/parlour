name: Multiplayer gate

# One desktop Chromium job. Create, join, deal, play, host death, walkover.
# WebKit iPhone + three-context veiled reconnect is not a merge signal —
# those paths live in the unit/duel suites, and the browser gate already
# covers WebKit for PWA and iOS chrome.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-context:
    name: Friend room
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the export
        run: pnpm --filter @parlour/web build

      - name: Install Chromium
        run: pnpm --filter @parlour/web exec playwright install --with-deps chromium

      - name: Friend-room suite
        env:
          PARLOUR_MULTIPLAYER_E2E: '1'
        run: pnpm --filter @parlour/web exec playwright test --config playwright.config.ts --project=chromium e2e/multiplayer.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: multiplayer-traces
          path: output/playwright
          retention-days: 7
