name: Multiplayer gate

# Multi-context friend-room suite against the static export. Signalling is
# hermetic (in-process broker), so this belongs on the same push/PR lane as
# the rest of CI rather than a morning cron that goes red with nobody pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-context:
    name: Multi-context friend room (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the export
        run: pnpm --filter @parlour/web build

      - name: Install browsers
        run: pnpm --filter @parlour/web exec playwright install --with-deps ${{ matrix.project }}

      - name: Multiplayer gate
        env:
          PARLOUR_MULTIPLAYER_E2E: '1'
        run: pnpm --filter @parlour/web exec playwright test --config playwright.config.ts --project=${{ matrix.project }} e2e/multiplayer.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: multiplayer-traces-${{ matrix.project }}
          path: output/playwright
          retention-days: 7

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Multi-context suite failed on ${{ matrix.project }}." \
            "Signalling is hermetic; treat this as a code or test regression."
