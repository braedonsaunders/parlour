name: Multiplayer gate

# Runs the multi-context friend-room suite against the static export.
#
# This suite connects to public Nostr relays and establishes real WebRTC
# peer connections, so it is sensitive to relay availability in a way the
# correctness e2e suite is not. It runs on a schedule (daily) and on manual
# dispatch rather than on every push, because a relay outage must not block
# a code change that has nothing to do with signalling.
#
# When the hermetic signalling seam lands (see the seam proposal in
# apps/web/e2e/multiplayer.spec.ts), this workflow moves into the push lane
# alongside the main browser gate.

on:
  schedule:
    # 08:00 UTC daily — after the CI lane has passed, before the working day.
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-context:
    name: Multi-context friend room (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the export
        run: pnpm --filter @parlour/web build

      - name: Install browsers
        run: pnpm --filter @parlour/web exec playwright install --with-deps ${{ matrix.project }}

      - name: Multiplayer gate
        env:
          PARLOUR_MULTIPLAYER_E2E: '1'
        run: pnpm --filter @parlour/web exec playwright test --config playwright.config.ts --project=${{ matrix.project }} e2e/multiplayer.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: multiplayer-traces-${{ matrix.project }}
          path: output/playwright
          retention-days: 7

      - name: Report relay failure
        if: failure()
        run: |
          echo "::warning::Multi-context suite failed on ${{ matrix.project }}." \
            "This may be a relay outage rather than a code regression —" \
            "check the trace for Nostr publish/resolve failures before" \
            "assuming the transport is broken."
