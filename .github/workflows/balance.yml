name: Balance gates

# The statistical half of the bot balance gates.
#
# These assert win-rate bands, which need a sample size that takes minutes to
# simulate. Run in the blocking lane they failed for load, not for regressions —
# three of eight `main` runs went red, and one fix was literally
# "allow balance gate under CI load". The PR lane now runs the exact, cheap half
# (determinism, coverage, no stalls) and this runs the rest on push.
#
# See packages/engine/src/sim/scale.ts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      games:
        description: 'Override the full-sample game count'
        required: false

concurrency:
  group: balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Full-sample balance simulation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run balance gates at full sample
        env:
          PARLOUR_FULL_SIM: '1'
          PARLOUR_SIM_GAMES: ${{ inputs.games }}
        run: pnpm --filter './packages/game-*' -r --no-bail test

      - name: Report
        if: failure()
        run: |
          echo "::error::Balance gates failed at full sample. This is a real signal:" \
               "the quick lane already proved determinism and coverage, so a failure" \
               "here means bot strength or persona balance actually moved."
