name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gates:
    name: Web and engine gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter './packages/**' --filter @parlour/web -r type-check

      - name: Test
        run: pnpm -r --no-bail test

      - name: Build
        run: pnpm build

  e2e:
    name: Browser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The suite runs against the static export, because the export is what
      # ships — to the host, into the Tauri shell, and into the service
      # worker's precache. `next dev` would test something else.
      - name: Build the export
        run: pnpm --filter @parlour/web build

      - name: Install browsers
        run: pnpm --filter @parlour/web exec playwright install --with-deps chromium webkit

      - name: End-to-end
        run: pnpm --filter @parlour/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: output/playwright
          retention-days: 7

  desktop:
    name: Desktop shell gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check desktop shell
        run: pnpm --filter @parlour/desktop type-check
