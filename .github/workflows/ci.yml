name: CI

# Main and pull requests only.
#
# This used to run on every branch push, which made sense when branches were
# occasional. With several agents pushing work-in-progress branches through the
# day it turned the Actions tab into a wall of expected red — every unfinished
# push failing on its way to being finished — and a failing run nobody is
# supposed to act on is worse than no run at all, because it trains everyone to
# ignore the ones that matter.
#
# The gate that decides anything is main, and nothing reaches main without the
# full gate having been run against the merge first. A branch that wants a
# verdict can open a pull request.
on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A push that supersedes another has nothing to say about the
# commit it replaced, and paying for both is how a gate gets slow enough to
# start being ignored.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Web and engine gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter './packages/**' --filter @parlour/web -r type-check

      # Packages first, then the web suite. A bare `pnpm -r test` also
      # runs the root package, whose test script is `pnpm -r test` again —
      # that second wave piles the Spider solver and the veiled-duel SRA
      # math onto the same 2-core runner and card-open deadlines miss.
      # Restrict the first step to ./packages so the root never re-enters,
      # then give web (cheap project, then duel) the machine to itself.
      - name: Test packages
        run: pnpm -r --no-bail --filter './packages/**' test

      - name: Test web
        run: pnpm --filter @parlour/web test

      - name: Build
        run: pnpm build

  e2e:
    name: Browser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The suite runs against the static export, because the export is what
      # ships — to the host, into the Tauri shell, and into the service
      # worker's precache. `next dev` would test something else.
      - name: Build the export
        run: pnpm --filter @parlour/web build

      - name: Install browsers
        run: pnpm --filter @parlour/web exec playwright install --with-deps chromium webkit

      - name: End-to-end
        run: pnpm --filter @parlour/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: output/playwright
          retention-days: 7

  multiplayer:
    name: Friend room
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the export
        run: pnpm --filter @parlour/web build

      - name: Install Chromium
        run: pnpm --filter @parlour/web exec playwright install --with-deps chromium

      # One desktop Chromium job. Create, join, deal, play, host death,
      # walkover. WebKit iPhone and three-context veiled reconnect are not a
      # merge signal — those paths live in the unit and duel suites, and the
      # browser gate above already covers WebKit for PWA and iOS chrome.
      - name: Friend-room suite
        env:
          PARLOUR_MULTIPLAYER_E2E: '1'
        run: pnpm --filter @parlour/web exec playwright test --config playwright.config.ts --project=chromium e2e/multiplayer.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: multiplayer-traces
          path: output/playwright
          retention-days: 7

  desktop:
    name: Desktop shell gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check desktop shell
        run: pnpm --filter @parlour/desktop type-check
